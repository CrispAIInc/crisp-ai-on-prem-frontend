steps:
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "frontend",
        "--source",
        ".",
        "--region",
        "us-central1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--set-build-env-vars",
        "VITE_API_ENDPOINT=https://backend-843040371870.us-central1.run.app/api",
      ]

options:
  logging: CLOUD_LOGGING_ONLY
